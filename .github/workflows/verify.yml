name: Verify Windows Build

on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "ReplayHUD*.cpp"
      - "ReplayHUD*.h"
      - "resource.h"
      - "cmake/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "ReplayHUD*.cpp"
      - "ReplayHUD*.h"
      - "resource.h"
      - "cmake/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replayhud-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build both architectures and verify embedded payloads
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Configure x86
        run: cmake -S . -B build-x86 -A Win32 -DREPLAYHUD_BUILD_BACKEND_TESTS=OFF

      - name: Build x86 components
        run: cmake --build build-x86 --config Release --target ReplayHUD ReplayHUDHook d3d8to9 ReplayHUDInjector32 --parallel

      - name: Configure x64
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DREPLAYHUD_BUILD_BACKEND_TESTS=OFF "-DREPLAYHUD_X86_HOOK=$PWD/build-x86/Release/ReplayHUDHook.dll" "-DREPLAYHUD_X86_INJECTOR=$PWD/build-x86/Release/ReplayHUDInjector32.exe"

      - name: Build x64 components
        run: cmake --build build --config Release --parallel

      - name: Verify architectures and embedded runtime payloads
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          import struct

          def read_pe(path):
              data = Path(path).read_bytes()
              if data[:2] != b"MZ":
                  raise SystemExit(f"{path}: missing DOS header")
              pe = struct.unpack_from("<I", data, 0x3c)[0]
              if data[pe:pe+4] != b"PE\\0\\0":
                  raise SystemExit(f"{path}: missing PE signature")
              machine, sections, _, _, _, optional_size = struct.unpack_from("<HHIIIH", data, pe + 4)
              optional = pe + 24
              magic = struct.unpack_from("<H", data, optional)[0]
              directory_offset = optional + (96 if magic == 0x10b else 112 if magic == 0x20b else 0)
              if not directory_offset:
                  raise SystemExit(f"{path}: unsupported optional header 0x{magic:04x}")
              resource_rva, resource_size = struct.unpack_from("<II", data, directory_offset + 16)
              section_table = optional + optional_size
              section_map = []
              for i in range(sections):
                  off = section_table + i * 40
                  virtual_size, virtual_address, raw_size, raw_pointer = struct.unpack_from("<IIII", data, off + 8)
                  section_map.append((virtual_address, max(virtual_size, raw_size), raw_pointer, raw_size))

              def offset_for_rva(rva):
                  for va, span, raw, raw_size in section_map:
                      if va <= rva < va + span and rva - va < raw_size:
                          return raw + rva - va
                  raise SystemExit(f"{path}: RVA 0x{rva:x} is not backed by file data")

              def resource_directory(directory_offset, wanted_id):
                  named, ids = struct.unpack_from("<HH", data, directory_offset + 12)
                  for i in range(named + ids):
                      name, target = struct.unpack_from("<II", data, directory_offset + 16 + i * 8)
                      if not (name & 0x80000000) and name == wanted_id:
                          return target
                  return None

              def resource(resource_id):
                  if not resource_rva or not resource_size:
                      return None
                  root = offset_for_rva(resource_rva)
                  type_entry = resource_directory(root, 10)  # RT_RCDATA
                  if type_entry is None or not (type_entry & 0x80000000):
                      return None
                  type_dir = root + (type_entry & 0x7fffffff)
                  name_entry = resource_directory(type_dir, resource_id)
                  if name_entry is None or not (name_entry & 0x80000000):
                      return None
                  name_dir = root + (name_entry & 0x7fffffff)
                  _, count = struct.unpack_from("<HH", data, name_dir + 12)
                  if count == 0:
                      return None
                  _, lang_entry = struct.unpack_from("<II", data, name_dir + 16)
                  if not (lang_entry & 0x80000000):
                      data_entry = root + (lang_entry & 0x7fffffff)
                  else:
                      lang_dir = root + (lang_entry & 0x7fffffff)
                      _, lang_count = struct.unpack_from("<HH", data, lang_dir + 12)
                      if lang_count == 0:
                          return None
                      _, leaf = struct.unpack_from("<II", data, lang_dir + 16)
                      if leaf & 0x80000000:
                          return None
                      data_entry = root + leaf
                  payload_rva, payload_size = struct.unpack_from("<II", data, data_entry)
                  payload_offset = offset_for_rva(payload_rva)
                  return data[payload_offset:payload_offset + payload_size]

              return data, machine, resource

          files = {
              "x86 app": ("build-x86/Release/ReplayHUD.exe", 0x14c),
              "x86 hook": ("build-x86/Release/ReplayHUDHook.dll", 0x14c),
              "x86 injector": ("build-x86/Release/ReplayHUDInjector32.exe", 0x14c),
              "x86 D3D8 proxy": ("build-x86/d3d8-proxy/Release/d3d8.dll", 0x14c),
              "x64 app": ("build/Release/ReplayHUD.exe", 0x8664),
              "x64 hook": ("build/Release/ReplayHUDHook.dll", 0x8664),
              "x64 D3D8 proxy": ("build/d3d8-proxy/Release/d3d8.dll", 0x8664),
          }
          binaries = {}
          for name, (path, expected) in files.items():
              blob, machine, get_resource = read_pe(path)
              if machine != expected:
                  raise SystemExit(f"FAIL {name}: machine 0x{machine:04x}, expected 0x{expected:04x}")
              binaries[name] = (blob, get_resource)
              print(f"PASS {name}: valid PE, machine 0x{machine:04x}")

          checks = [
              ("x64 app resource 201 embeds x64 hook", "x64 app", 201, "x64 hook"),
              ("x64 app resource 202 embeds x86 hook", "x64 app", 202, "x86 hook"),
              ("x64 app resource 203 embeds x86 injector", "x64 app", 203, "x86 injector"),
              ("x64 D3D8 resource 204 embeds x64 hook", "x64 D3D8 proxy", 204, "x64 hook"),
              ("x86 D3D8 resource 204 embeds x86 hook", "x86 D3D8 proxy", 204, "x86 hook"),
          ]
          for label, parent, resource_id, payload_name in checks:
              embedded = binaries[parent][1](resource_id)
              if embedded is None:
                  raise SystemExit(f"FAIL {label}: resource ID {resource_id} missing")
              if embedded != binaries[payload_name][0]:
                  raise SystemExit(f"FAIL {label}: resource contents differ from built payload")
              print(f"PASS {label}")

          print(f"Verified {len(files)} PE binaries and {len(checks)} embedded payloads.")
          '@ | python -
