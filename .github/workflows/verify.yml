name: Verify Windows Build

on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "ReplayHUD*.cpp"
      - "ReplayHUD*.h"
      - "resource.h"
      - "cmake/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "ReplayHUD*.cpp"
      - "ReplayHUD*.h"
      - "resource.h"
      - "cmake/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replayhud-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build both architectures and verify embedded payloads
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Configure x86
        run: cmake -S . -B build-x86 -A Win32 -DREPLAYHUD_BUILD_BACKEND_TESTS=OFF

      - name: Build x86 components
        run: cmake --build build-x86 --config Release --target ReplayHUD ReplayHUDHook d3d8to9 ReplayHUDInjector32 --parallel

      - name: Configure x64
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DREPLAYHUD_BUILD_BACKEND_TESTS=OFF "-DREPLAYHUD_X86_HOOK=$PWD/build-x86/Release/ReplayHUDHook.dll" "-DREPLAYHUD_X86_INJECTOR=$PWD/build-x86/Release/ReplayHUDInjector32.exe"

      - name: Build x64 components
        run: cmake --build build --config Release --parallel

      - name: Verify architectures and embedded runtime payloads
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          import struct

          def read_pe(path):
              data = Path(path).read_bytes()
              if data[:2] != b"MZ":
                  raise SystemExit(f"{path}: missing DOS header")
              pe = struct.unpack_from("<I", data, 0x3c)[0]
              if data[pe:pe+4] != b"PE\0\0":
                  raise SystemExit(f"{path}: missing PE signature")
              machine = struct.unpack_from("<H", data, pe + 4)[0]
              return data, machine

          files = {
              "x86 app": ("build-x86/Release/ReplayHUD.exe", 0x14c),
              "x86 hook": ("build-x86/Release/ReplayHUDHook.dll", 0x14c),
              "x86 injector": ("build-x86/Release/ReplayHUDInjector32.exe", 0x14c),
              "x86 D3D8 proxy": ("build-x86/d3d8-proxy/Release/d3d8.dll", 0x14c),
              "x64 app": ("build/Release/ReplayHUD.exe", 0x8664),
              "x64 hook": ("build/Release/ReplayHUDHook.dll", 0x8664),
              "x64 D3D8 proxy": ("build/d3d8-proxy/Release/d3d8.dll", 0x8664),
          }
          blobs = {}
          for name, (path, expected) in files.items():
              blob, machine = read_pe(path)
              if machine != expected:
                  raise SystemExit(f"FAIL {name}: machine 0x{machine:04x}, expected 0x{expected:04x}")
              blobs[name] = blob
              print(f"PASS {name}: valid PE, machine 0x{machine:04x}")

          checks = [
              ("x64 app contains x64 hook", "x64 app", "x64 hook"),
              ("x64 app contains x86 hook", "x64 app", "x86 hook"),
              ("x64 app contains x86 injector", "x64 app", "x86 injector"),
              ("x64 D3D8 proxy contains x64 hook", "x64 D3D8 proxy", "x64 hook"),
              ("x86 D3D8 proxy contains x86 hook", "x86 D3D8 proxy", "x86 hook"),
          ]
          for label, parent, payload in checks:
              if blobs[payload] not in blobs[parent]:
                  raise SystemExit(f"FAIL {label}")
              print(f"PASS {label}")

          print(f"Verified {len(files)} PE binaries and {len(checks)} embedded payloads.")
          '@ | python -
