name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build Release executable
        run: cmake --build build --config Release --parallel

      - name: Package release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "build/Release/ReplayHUD.exe"
          if (!(Test-Path $exe)) {
            throw "Expected executable was not produced: $exe"
          }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $exe "release/ReplayHUD.exe"
          Copy-Item "README.md" "release/README.md"
          Copy-Item "LICENSE.txt" "release/LICENSE.txt"
          Compress-Archive -Path "release/ReplayHUD.exe", "release/README.md", "release/LICENSE.txt" `
            -DestinationPath "ReplayHUD-Windows-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReplayHUD-Windows-x64
          path: |
            release/ReplayHUD.exe
            ReplayHUD-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ReplayHUD ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/ReplayHUD.exe
            ReplayHUD-Windows-x64.zip
