name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replayhud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build bundled x64 app and x86 runtime
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure x86
        run: cmake -S . -B build-x86 -A Win32 -DREPLAYHUD_BUILD_BACKEND_TESTS=OFF

      - name: Build x86 hook, D3D8 proxy, and injector
        run: cmake --build build-x86 --config Release --target ReplayHUDHook d3d8to9 ReplayHUDInjector32 --parallel

      - name: Configure x64 app with x86 runtime components
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DREPLAYHUD_BUILD_BACKEND_TESTS=OFF "-DREPLAYHUD_X86_HOOK=$PWD/build-x86/Release/ReplayHUDHook.dll" "-DREPLAYHUD_X86_INJECTOR=$PWD/build-x86/Release/ReplayHUDInjector32.exe"

      - name: Build x64 app and proxy
        run: cmake --build build --config Release --parallel

      - name: Package release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(
            "build/Release/ReplayHUD.exe",
            "build/d3d8-proxy/Release/d3d8.dll",
            "build-x86/d3d8-proxy/Release/d3d8.dll",
            "README.md",
            "LICENSE.txt",
            "build/_deps/universal_imgui_hook-src/LICENSE",
            "build/_deps/d3d8to9-src/LICENSE.md"
          )
          foreach ($file in $files) {
            if (!(Test-Path $file)) { throw "Expected release file not found: $file" }
          }

          New-Item -ItemType Directory -Force -Path "release/x86" | Out-Null
          Copy-Item "build/Release/ReplayHUD.exe" "release/ReplayHUD.exe"
          Copy-Item "build/d3d8-proxy/Release/d3d8.dll" "release/d3d8.dll"
          Copy-Item "build-x86/d3d8-proxy/Release/d3d8.dll" "release/x86/d3d8.dll"
          Copy-Item "README.md" "release/README.md"
          Copy-Item "LICENSE.txt" "release/LICENSE.txt"
          Copy-Item "build/_deps/universal_imgui_hook-src/LICENSE" "release/LICENSE-Universal-Dear-ImGui-Hook.txt"
          Copy-Item "build/_deps/d3d8to9-src/LICENSE.md" "release/LICENSE-d3d8to9.txt"
          Compress-Archive -Path "release/*" -DestinationPath "ReplayHUD-Windows.zip" -Force

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ReplayHUD-Windows
          path: |
            release/**
            ReplayHUD-Windows.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ReplayHUD-Windows
          path: .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ReplayHUD ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ReplayHUD-Windows.zip
            release/ReplayHUD.exe
            release/d3d8.dll
